<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味のバックログ管理</title>
    <meta name="description" content="本・ゲーム・プラモデルなどの趣味のバックログを登録・編集・フィルタ・並び替えで管理できるWebアプリです。">
    <meta property="og:title" content="趣味のバックログ管理">
    <meta property="og:description" content="本・ゲーム・プラモデルなどの趣味のバックログを登録・編集・フィルタ・並び替えで管理できるWebアプリです。">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>趣味のバックログ管理</h1>
    </header>

    <div class="app-wrapper">
        <div id="status-message" class="status-message" role="status" aria-live="polite" hidden></div>

        <main>
            <section id="input-form-section" aria-labelledby="form-title">
                <h2 id="form-title">アイテム入力</h2>
                <form id="item-form" novalidate>
                    <p id="form-error" class="form-error" role="alert" hidden></p>

                    <div class="form-field">
                        <label for="name">名前 <span class="required-mark" aria-hidden="true">*</span></label>
                        <input type="text" id="name" name="name" required aria-required="true" maxlength="120" autocomplete="off">
                    </div>

                    <div class="form-field">
                        <label for="category">カテゴリ</label>
                        <select id="category" name="category">
                            <option value="本">本</option>
                            <option value="ゲーム">ゲーム</option>
                            <option value="プラモデル">プラモデル</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="image">画像</label>
                        <input type="file" id="image" name="image" accept="image/*">
                        <div id="current-image-preview" class="image-preview" hidden></div>
                    </div>

                    <div class="form-field">
                        <label for="purchase-date">購入日</label>
                        <input type="date" id="purchase-date" name="purchase-date">
                    </div>

                    <div class="form-field">
                        <label for="notes">メモ</label>
                        <textarea id="notes" name="notes" rows="4" maxlength="1000"></textarea>
                    </div>

                    <div class="form-field">
                        <label for="status">ステータス</label>
                        <select id="status" name="status">
                            <option value="未着手">未着手</option>
                            <option value="進行中">進行中</option>
                            <option value="一時中断">一時中断</option>
                            <option value="完了">完了</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="add-button" class="btn">追加</button>
                        <button type="submit" id="update-button" class="btn" hidden>更新</button>
                        <button type="button" id="cancel-button" class="btn">キャンセル</button>
                    </div>
                </form>
            </section>

            <section id="display-section" aria-labelledby="list-title">
                <div class="section-header">
                    <h2 id="list-title">アイテム一覧</h2>
                    <div class="list-summary">
                        <span id="item-count" class="item-count" aria-live="polite">全0件</span>
                        <button type="button" id="reset-filters-btn" class="btn btn-link" hidden>フィルタを解除</button>
                    </div>
                </div>

                <div class="controls-bar">
                    <div id="filter-controls">
                        <div class="control-group">
                            <label for="filter-category">カテゴリ:</label>
                            <select id="filter-category">
                                <option value="すべて">すべて</option>
                                <option value="本">本</option>
                                <option value="ゲーム">ゲーム</option>
                                <option value="プラモデル">プラモデル</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="filter-status">ステータス:</label>
                            <select id="filter-status">
                                <option value="すべて">すべて</option>
                                <option value="未着手">未着手</option>
                                <option value="進行中">進行中</option>
                                <option value="一時中断">一時中断</option>
                                <option value="完了">完了</option>
                            </select>
                        </div>
                    </div>

                    <div id="sort-controls">
                        <div class="control-group">
                            <label for="sort-by">並び替え:</label>
                            <select id="sort-by">
                                <option value="date-desc">購入日 (新しい順)</option>
                                <option value="date-asc">購入日 (古い順)</option>
                                <option value="name-asc">名前 (昇順)</option>
                                <option value="name-desc">名前 (降順)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="item-list" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-message">
        <div class="confirm-dialog-content">
            <h3 id="delete-dialog-title">アイテムの削除</h3>
            <p id="delete-dialog-message"></p>
            <div class="confirm-dialog-actions">
                <button type="button" id="delete-dialog-cancel" class="btn btn-secondary">キャンセル</button>
                <button type="button" id="delete-dialog-confirm" class="btn btn-danger">削除する</button>
            </div>
        </div>
    </dialog>

    <script src="logic.js"></script>
    <script src="script.js"></script>
</body>
</html>
